# Reference copy only. Terraform (eks-platform-infra/modules/argocd-bootstrap)
# creates this Application; it lives here so the whole app-of-apps tree is
# readable from one repo. Change it in Terraform, not here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Barnbarn96/eks-platform-gitops.git
    targetRevision: main
    path: argocd-apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
