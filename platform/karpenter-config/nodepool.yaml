apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        node-role: workload
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:
        # Spot preferred; Karpenter falls back to on-demand when spot
        # capacity isn't available for any allowed instance type
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        # Both architectures: Karpenter picks whichever is cheapest unless a
        # pod asks for one (nodeSelector kubernetes.io/arch). Images that are
        # amd64-only must set that selector.
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64", "amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r", "t"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
        # Small instances only (<= 8 vCPU): this is a lab
        - key: karpenter.k8s.aws/instance-cpu
          operator: Lt
          values: ["9"]

      # Recycle nodes weekly even if nothing else replaces them
      expireAfter: 168h

  # Cost cap: Karpenter won't launch past this total across the pool.
  # Pods beyond it stay Pending (Phase 6 drill: capacity exhaustion).
  limits:
    cpu: "8"
    memory: 32Gi

  disruption:
    # Remove empty nodes and repack underused ones onto fewer/cheaper nodes
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
