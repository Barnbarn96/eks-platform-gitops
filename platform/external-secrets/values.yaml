installCRDs: true

# Must match the Pod Identity association in Terraform (modules/platform-iam)
serviceAccount:
  name: external-secrets

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

# System nodes are tainted CriticalAddonsOnly=true:NoSchedule (Terraform:
# modules/cluster). Platform pods tolerate it and select node-role=system.
nodeSelector:
  node-role: system
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
    effect: NoSchedule

webhook:
  nodeSelector:
    node-role: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoSchedule

certController:
  nodeSelector:
    node-role: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoSchedule
