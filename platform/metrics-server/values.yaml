# Feeds `kubectl top` and the HorizontalPodAutoscaler (Phase 3)
replicas: 2

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# System nodes are tainted CriticalAddonsOnly=true:NoSchedule (Terraform:
# modules/cluster). Platform pods tolerate it and select node-role=system.
nodeSelector:
  node-role: system
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
    effect: NoSchedule
